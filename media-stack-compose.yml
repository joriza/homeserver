# Stack de medios automatizado — homeserver 192.168.1.200
# Radarr(pelis) Sonarr(series) Prowlarr(indexadores)
# qBittorrent(descargas) Bazarr(subtitulos)
# Instalado 2026-11-25. Web UIs: 7878/8989/9696/8081/6767 (LAN, UFW)
services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - LOG_LEVEL=info
    ports:
      - 8191:8191
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
      - WEBUI_PORT=8081
    volumes:
      - ./config/qbittorrent:/config
      - /srv/downloads/torrents:/downloads
    ports:
      - 8081:8081
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - ./config/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - ./config/radarr:/config
      - /srv/downloads/torrents:/downloads
      - /srv/media/peliculas:/movies
    ports:
      - 7878:7878
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - ./config/sonarr:/config
      - /srv/downloads/torrents:/downloads
      - /srv/media/series:/tv
    ports:
      - 8989:8989
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - ./config/bazarr:/config
      - /srv/media/peliculas:/movies
      - /srv/media/series:/tv
    ports:
      - 6767:6767
    restart: unless-stopped
